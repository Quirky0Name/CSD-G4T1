spring:
  application:
    name: storage
  # datasource comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

storage:
  jwt-secret: ${JWT_SECRET}
  grobid-url: ${GROBID_URL:http://localhost:8070}
  crossref-mailto: ${CROSSREF_MAILTO:}
  openalex-api-key: ${OPENALEX_API_KEY:}

server:
  port: ${PORT:8081}
