<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Microservices</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .frame { max-width: 576px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin: 0 0 0.25rem 40px;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--color-ink);
      margin: 0 0 0.25rem 40px;
    }

    svg { width: 100%; min-width: 576px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">CS203 · G4T1</p>
    <h1>Main microservices</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 576 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="microservices-title microservices-desc">
        <title id="microservices-title">Main microservices</title>
        <desc id="microservices-desc">The frontend calls Storage Management; Updating polls external APIs, stores snapshots in Storage Management and nudges Research Evaluation, which stores alerts and reports there and calls Gemini and Telegram.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first (behind boxes) -->
        <!-- Frontend → Storage -->
        <line x1="288" y1="104" x2="288" y2="166" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
        <!-- Updating → Storage -->
        <line x1="144" y1="304" x2="144" y2="234" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
        <!-- Research Evaluation → Storage -->
        <line x1="432" y1="304" x2="432" y2="234" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
        <!-- Updating → Research Evaluation (the nudge) -->
        <line x1="248" y1="336" x2="326" y2="336" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
        <!-- Updating → External -->
        <line x1="144" y1="368" x2="144" y2="430" stroke="#2e5aa8" stroke-width="1.6" marker-end="url(#arrow-link)"/>
        <!-- Research Evaluation → External -->
        <line x1="432" y1="368" x2="432" y2="430" stroke="#2e5aa8" stroke-width="1.6" marker-end="url(#arrow-link)"/>

        <!-- Arrow labels (opaque masks, 8px from their stroke) -->
        <rect x="296" y="128" width="72" height="16" rx="2" fill="#f5f5f5"/>
        <text x="332" y="140" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REST API</text>

        <rect x="152" y="260" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="192" y="272" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SNAPSHOTS</text>

        <rect x="304" y="260" width="120" height="16" rx="2" fill="#f5f5f5"/>
        <text x="364" y="272" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALERTS·REPORTS</text>

        <rect x="264" y="312" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="288" y="324" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NUDGE</text>

        <rect x="152" y="392" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="172" y="404" fill="#2e5aa8" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POLL</text>

        <rect x="320" y="392" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="372" y="404" fill="#2e5aa8" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JUDGE+NOTIFY</text>

        <!-- Node: Frontend -->
        <rect x="188" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="188" y="40" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="288" y="70" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frontend</text>
        <text x="288" y="90" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">React · TypeScript</text>

        <!-- Node: Storage Management (owns all persistence) -->
        <rect x="40" y="168" width="496" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="168" width="496" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="288" y="198" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Storage Management</text>
        <text x="288" y="218" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Spring Boot · Postgres · PDF files</text>

        <!-- Node: Updating -->
        <rect x="40" y="304" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="304" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="334" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Updating</text>
        <text x="144" y="354" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI · APScheduler</text>

        <!-- Node: Research Evaluation (focal) -->
        <rect x="328" y="304" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="328" y="304" width="208" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
        <text x="432" y="334" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Research Evaluation</text>
        <text x="432" y="354" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI · Python</text>

        <!-- Node: External APIs -->
        <rect x="40" y="432" width="496" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="432" width="496" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="288" y="462" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External APIs</text>
        <text x="288" y="482" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Crossref · OpenAlex · Gemini · Telegram</text>

        <!-- Legend strip -->
        <line x1="40" y1="520" x2="536" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="40" y="536" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="64" y="546" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Focal service</text>

        <rect x="168" y="536" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="192" y="546" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Service</text>

        <rect x="296" y="536" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="320" y="546" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Data owner</text>

        <rect x="424" y="536" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="448" y="546" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Third party</text>

        <line x1="40" y1="568" x2="64" y2="568" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
        <text x="72" y="572" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Internal call</text>

        <line x1="168" y1="568" x2="192" y2="568" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
        <text x="200" y="572" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Change nudge</text>

        <line x1="296" y1="568" x2="320" y2="568" stroke="#2e5aa8" stroke-width="1.6" marker-end="url(#arrow-link)"/>
        <text x="328" y="572" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">External call</text>
      </svg>
    </div>
  </div>
</body>
</html>
