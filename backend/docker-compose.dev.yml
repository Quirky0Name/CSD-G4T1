# Local dev stack for Research Evaluation + Updating.
# Round 1: brings up GROBID + Postgres (real dependencies) and both
# FastAPI apps as empty stubs, to confirm everything builds and boots.
# See ../ARCHITECTURE.md and ../SETUP.md.

services:
  grobid:
    image: grobid/grobid:0.9.1-crf
    ports:
      - "8070:8070"
    mem_limit: 2g

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: research_assistant
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  research-evaluation:
    build: .
    command: ["uvicorn", "research_evaluation.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - re_cache:/app/cache
    ports:
      - "8000:8000"
    depends_on:
      - grobid

  updating:
    build: .
    command: ["uvicorn", "updating.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - research-evaluation

volumes:
  pg_data:
  re_cache:
