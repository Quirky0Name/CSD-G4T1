# Local dev stack for Research Evaluation + Updating.
# Brings up GROBID + Postgres (real dependencies) and both FastAPI apps.
# Updating polls on a schedule and nudges Research Evaluation, which stores alerts in
# Storage Management (running on the host).
# See ../ARCHITECTURE.md and ../SETUP.md.

services:
  grobid:
    image: grobid/grobid:0.9.1-crf
    ports:
      - "8070:8070"
    mem_limit: 2g

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: research_assistant
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev", "-d", "research_assistant"]
      interval: 2s
      timeout: 3s
      retries: 15

  research-evaluation:
    build: .
    command: ["uvicorn", "research_evaluation.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    # inside the container, localhost is the container itself
    environment:
      SM_BASE_URL: http://host.docker.internal:8081
    # Linux needs this for host.docker.internal (Storage Management runs on the host)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - re_cache:/app/cache
    ports:
      - "8000:8000"
    depends_on:
      - grobid

  updating:
    build: .
    command: ["uvicorn", "updating.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    env_file:
      - .env
    # inside the container, localhost is the container itself
    environment:
      SM_BASE_URL: http://host.docker.internal:8081
      RE_BASE_URL: http://research-evaluation:8000
      DATABASE_URL: postgresql+asyncpg://dev:dev@postgres:5432/research_assistant
    # Linux needs this for host.docker.internal (Storage Management runs on the host)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      research-evaluation:
        condition: service_started

volumes:
  pg_data:
  re_cache:
