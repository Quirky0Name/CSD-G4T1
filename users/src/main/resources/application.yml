spring:
  # datasource comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # With flyway.schemas below: tables and Flyway's history live in a users schema, so on a
        # Postgres shared with storage (public schema) neither service's tables or history collide.
        default_schema: users
  flyway:
    schemas: users
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: true
  # the SMTP server for outside notifications; with no MAIL_HOST, email isn't sent. 10 s a step, so one
  # unreachable server can't hold a request. STARTTLS is used when the server offers it
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

users:
  # the same base64 secret every service shares; it signs the tokens they check
  jwt-secret: ${JWT_SECRET}
  # Storage Management, which clears a project's papers and draft when the project is deleted
  storage-url: ${SM_BASE_URL:http://localhost:8081}
  # the admin account and what only it can do; off unless DEV_MODE=true
  dev-mode: ${DEV_MODE:false}
  # the refresh token's cookie is Secure (HTTPS only) when true: true on the deployed server
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  # the From address of outside notification emails
  mail-from: ${MAIL_FROM:}
  # the site's address, for the link to the paper in a notification; no link when empty
  app-url: ${APP_URL:}
