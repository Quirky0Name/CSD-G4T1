# Layered on top of main application.yml. Tests run the real Flyway migrations on
# in-memory H2 in Postgres mode, so a migration that drifts from the entities fails
# the build without needing Docker.
spring:
  datasource:
    url: jdbc:h2:mem:users;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1

users:
  # test-only key, base64 like the real JWT_SECRET; 64 bytes, long enough that the
  # JWT library would pick HS512 on its own instead of the contract's HS256
  jwt-secret: dXNlcnMtdGVzdC1zZWNyZXQtbm90LWZvci1wcm9kLWxvbmctZW5vdWdoLXRvLXRlbXB0LWhzNTEyLXNpZ25pbg==
